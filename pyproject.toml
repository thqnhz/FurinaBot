[project]
name = "Furina"
version = "1.0.0"
description = "Minigames focused Discord bot"
authors = [{name = "Nguyễn Duy Thanh", email = "thvnhz@gmail.com"}]
license = "Apache-2.0"
dependencies = [
    "aiohttp",
    "asqlite",
    "dateparser",
    "docstring-parser",
    "enka",
    "jishaku",
    "numpy",
    "psutil",
    "python-dotenv",
    "typing-extensions>=4.14.1",
    "anyio>=4.11.0",
    "discord-py>=2.7.1",
]

requires-python = "<4.0.0,>=3.10.0"

[tool.setuptools]
packages = ['core', 'cogs', 'assets']


[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
# Config by Umbra @ https://github.com/AbstractUmbra/Mipha/blob/main/pyproject.toml
preview = true
select = [
    "A",
    "ANN",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "COM",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "F",
    "FA",
    "FBT",
    "FURB",
    "G",
    "I",
    "INP",
    "ISC",
    "NPY",
    "PD",
    "PERF",
    "PGH",
    "PIE",
    "PLC",
    "PLE",
    "PLW",
    "PTH",
    "PYI",
    "Q",
    "avoidable-escaped-quote",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLOT",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "YTT"
]
ignore = [
    "commented-out-code",   # Ignore commented-out code
    "any-type",
    "async-function-with-timeout", # dpy commonly uses this parameter
    "missing-trailing-comma",
    "raw-string-in-exception",    # in this case this is okay
    "unused-import",
    "import-shadowed-by-loop-var",
    "undefined-local-with-import-star",
    "undefined-local-with-import-star-usage",
    "implicit-namespace-package",   # due to how I load modules this results in annoyances
    "pandas-use-of-dot-values",    # this is not a numpy codebase
    "try-except-in-loop",
    "useless-import-alias",  # pyright ruling for `as` imports needed
    "bad-quotes-inline-string",
    "ambiguous-unicode-character-string",
    "function-call-in-dataclass-default-argument",
    "assert",     # assert is used for type checking in this codebase
    "suppressible-exception",
    "raise-vanilla-args",   # over-eager rule
    "raise-within-try",   # unrealistic rule
    "extraneous-parentheses",
    "non-empty-init-module",   # it's back :skull:
]
unfixable = [
    "line-too-long", # line length handled in other ways by ruff format
    "ERA",  # Don't delete commented out code
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.isort]
split-on-trailing-comma = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "csv"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# https://discuss.python.org/t/problems-with-typeis/55410/6
# https://discuss.python.org/t/problems-with-typeis/55410/46
# Until what can go into a TypeIs/TypeGuard changes, these are just dangerous.
"typing.TypeIs".msg = "TypeIs is fundamentally unsafe, even when using it as described to be safe"
"typing.TypeGuard".msg = "TypeGuard is fundamentally unsafe"
"typing_extensions.TypeIs".msg = "TypeIs is fundamentally unsafe, even when using it as described to be safe"
"typing_extensions.TypeGuard".msg = "TypeGuard is fundamentally unsafe"

